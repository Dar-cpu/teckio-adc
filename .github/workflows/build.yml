name: Build installer and package firmware sources
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adc-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package C and H files only (no firmware compilation)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('ad7195/firmware')
          Path('artifacts').mkdir(exist_ok=True)
          files = sorted(p for p in root.rglob('*') if p.suffix in {'.c', '.h'})
          assert files and (root / 'main.c') in files
          with ZipFile('artifacts/TECKIO-AD7195-firmware-sources.zip', 'w', ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.relative_to(root))
          print(f'Packaged {len(files)} source files; no compiler was invoked.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TECKIO-AD7195-sources
          path: artifacts/TECKIO-AD7195-firmware-sources.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core and connection regression tests
        run: dotnet run --project tests/Teckio.Adc.Tests -c Release
      - name: Publish application files for installation
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("$env:GITHUB_REF_TYPE" -eq "tag" -and "$env:GITHUB_REF_NAME" -ne "v$version") { throw "Tag must match Directory.Build.props Version" }
          dotnet publish src/Teckio.AdcLab/Teckio.AdcLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
      - name: Build normal Windows installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/Teckio.AdcLab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $hash = (Get-FileHash artifacts/installer/Teckio.AdcLab.Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Teckio.AdcLab.Setup.exe" | Set-Content artifacts/installer/Teckio.AdcLab.Setup.exe.sha256 -Encoding ascii
      - name: Install, update in place, run WPF/PDF smoke test, uninstall
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'TECKIO ADC Lab'
          $qa = Join-Path $pwd 'artifacts/qa'
          New-Item -ItemType Directory -Force $qa | Out-Null
          $setupArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$install`" /LOG=`"$qa/install.log`""
          $p = Start-Process artifacts/installer/Teckio.AdcLab.Setup.exe -ArgumentList $setupArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          if (!(Test-Path "$install/unins000.exe")) { throw "Uninstaller missing" }
          $prefs = Join-Path $env:LOCALAPPDATA 'TECKIO/ADC Lab'
          New-Item -ItemType Directory -Force $prefs | Out-Null
          Set-Content "$prefs/installer-test.txt" 'preserve-user-data'
          $p = Start-Process artifacts/installer/Teckio.AdcLab.Setup.exe -ArgumentList ($setupArgs -replace 'install.log','update.log') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "In-place update failed" }
          if ((Get-Content "$prefs/installer-test.txt") -ne 'preserve-user-data') { throw "Update lost user data" }
          $p = Start-Process "$install/Teckio.AdcLab.exe" -ArgumentList "--smoke-test `"$qa`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$qa/error.txt" -ErrorAction SilentlyContinue; throw "Installed application smoke test failed" }
          $p = Start-Process "$install/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed" }
          if (Test-Path "$install/Teckio.AdcLab.exe") { throw "Application was not uninstalled" }
          if ((Get-Content "$prefs/installer-test.txt") -ne 'preserve-user-data') { throw "Uninstall lost user data" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TECKIO-ADC-Lab-visual-QA
          path: artifacts/qa
      - uses: actions/upload-artifact@v4
        with:
          name: TECKIO-ADC-Lab-Installer-x64
          path: artifacts/installer
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [firmware-sources, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TECKIO-ADC-Lab-Installer-x64
          path: installer-assets
      - uses: actions/download-artifact@v4
        with:
          name: TECKIO-AD7195-sources
          path: firmware-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            current_head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [ "$current_head" != "$SOURCE_SHA" ]; then
              echo "A newer main commit is building; skip publication of this superseded build."
              exit 0
            fi
          fi
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)
          release_tag="v$version"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists. Increase Version for a new release."
            exit 0
          fi
          gh release create "$release_tag" installer-assets/Teckio.AdcLab.Setup.exe installer-assets/Teckio.AdcLab.Setup.exe.sha256 firmware-assets/TECKIO-AD7195-firmware-sources.zip --target "$SOURCE_SHA" --title "TECKIO ADC Lab $release_tag" --notes-file docs/RELEASE_NOTES.md
